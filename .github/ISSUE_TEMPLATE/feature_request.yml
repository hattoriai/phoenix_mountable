name: Feature request
description: An idea, or a change to what PhoenixMountable does.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. A change of behaviour or a new feature is agreed here before a pull request (see CONTRIBUTING.md).

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, in your library or in a host app, and what stops you today.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you propose
      description: How it would look in a definition module, a host router or a guide. Say if it changes what PhoenixMountable does today, or what it generates in a host.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What else you considered
      description: Other designs, and what you do today instead.

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched the open and closed issues.
          required: true
        - label: I would like to make the pull request myself.
